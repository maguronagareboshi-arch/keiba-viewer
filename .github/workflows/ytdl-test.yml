# 実験: GitHub Actions のデータセンターIPから YouTube の高知けいば中継が取得できるか(2026-08-01)。
# 通れば区間ラップの遡り計測を丸ごとクラウドに載せられる(PC不要)。通らなければPC必須が確定。
# ⛔本番デプロイには無関係(workflow_dispatch のみ・ページには一切触らない)。判定が出たら消してよい。
name: ytdl-test
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: install yt-dlp
        run: pipx install yt-dlp || pip install --user yt-dlp

      - name: probe formats
        run: |
          set +e
          VID=kN4zGW1Kmjk   # 高知けいば中継 2026/03/24 (7.7時間のアーカイブ)
          echo "== フォーマット一覧が引けるか =="
          yt-dlp -F --no-warnings "https://www.youtube.com/watch?v=$VID" > fmts.txt 2> err0.txt
          RC0=$?
          echo "rc=$RC0"; tail -5 fmts.txt; head -3 err0.txt
          for FMT in 133 299; do
            echo "== fmt=$FMT で60秒だけ取得 =="
            timeout 300 yt-dlp -f $FMT --download-sections "*4300-4360" \
              --retries 2 --fragment-retries 2 --socket-timeout 15 --no-warnings \
              -o "probe_$FMT.%(ext)s" "https://www.youtube.com/watch?v=$VID" > out_$FMT.txt 2>&1
            RC=$?
            SZ=$(stat -c%s probe_$FMT.mp4 2>/dev/null || echo 0)
            echo "fmt=$FMT rc=$RC size=$SZ"
            tail -3 out_$FMT.txt
            if [ "$SZ" -gt 100000 ]; then echo "RESULT fmt=$FMT PASS ($SZ bytes)"; else echo "RESULT fmt=$FMT FAIL"; fi
          done
          echo "== チャンネル一覧(冒頭5行) =="
          timeout 120 yt-dlp --flat-playlist --print "%(id)s|%(title)s" --playlist-end 5 --no-warnings \
            "https://www.youtube.com/channel/UCwGgMN7UlYobxOzIpknGo-A/streams" > list.txt 2>&1
          RCL=$?
          echo "rc=$RCL"; cat list.txt | head -6
          if [ -s list.txt ] && [ "$RCL" = "0" ]; then echo "RESULT playlist PASS"; else echo "RESULT playlist FAIL"; fi
          true
