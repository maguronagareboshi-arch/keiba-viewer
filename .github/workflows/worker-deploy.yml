# Worker(keiba-proxydeploy)を GitHub から手で出す。
# ⛔このPCに node/npx が入っていないので `npx wrangler deploy` は手元で打てない(2026-08-30 実測)。
#   ここに置くと **Actions の画面のボタン1つ**で出せる= PC を閉じていても出せる。
#
# 使う前に一度だけ要る設定(ユーザーの手番・鍵は私からは触れません):
#   1) Cloudflare → 右上のアイコン → My Profile → API Tokens → Create Token
#      → テンプレート「Edit Cloudflare Workers」→ Account/Zone は既定のまま → Create → **表示された値をコピー**
#   2) GitHub の keiba-deploy → Settings → Secrets and variables → Actions → New repository secret
#        CLOUDFLARE_API_TOKEN = 1 の値   ← **これ1つだけでよい**
#   3) Actions タブ → 「Deploy worker」→ Run workflow(confirm に deploy)
#
#   ⚠ もし deploy が「アカウントが特定できない」と言って落ちたときだけ、失敗ログに出るアカウントの ID を
#      CLOUDFLARE_ACCOUNT_ID という名前でもう1つ Secret に足して、もう一度 Run workflow を押す。
#      ⛔アカウントが1つしか無いなら**要りません**。
#
# ⛔ wrangler.toml は `keep_vars = true` なので、既に入れてある Secret(ADMIN_WRITE_TOKEN など)は消えません。
# ⛔ 出す中身は main の cloudflare-worker.js。出す前に「いま出ているものと違うか」を必ず表示します。
name: Deploy worker

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '本番の Worker を出します。deploy と入力してください'
        required: true
        default: ''

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # ⛔#1 の失敗の原因はここ: `cloudflare-worker.js` は 1行目で `@cloudflare/puppeteer` を import しており、
      #   deploy の前に依存を入れる必要がある。wrangler-action は lockfile を見て**勝手に pnpm を選ぶ**が、
      #   runner に pnpm が入っておらず "Unable to locate executable file: pnpm" で落ちた。
      #   ⛔このリポジトリは pnpm(pnpm-lock.yaml の lockfileVersion 9.0)なので pnpm で揃える。
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 依存を入れる(@cloudflare/puppeteer)
        run: pnpm install --frozen-lockfile

      - name: 確認の入力を検査する
        shell: bash
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "confirm に deploy と入力されていないので中止します"
            exit 1
          fi

      # ⛔出す前に「いま本番で動いているもの」を見る。CORS の許可 origin で新旧を見分けられる
      #   (§58 で nar.yukochi.com を足したので、出ていれば Access-Control-Allow-Origin がそれを返す)
      - name: いまの本番の状態を見る(出す前)
        shell: bash
        run: |
          echo "--- Origin: https://nar.yukochi.com を付けて OPTIONS ---"
          curl -s -i -X OPTIONS -H 'Origin: https://nar.yukochi.com' \
            'https://keiba-proxydeploy.maguronagareboshi.workers.dev/rpc/admin-chihou-own?race_id=1' \
            | grep -i '^HTTP\|access-control-allow-origin' || true
          echo "(allow-origin が https://yukochi.com なら §58 は未デプロイ / nar.yukochi.com なら反映済み)"

      # ⛔accountId は**任意**。トークンが1つのアカウントにしか使えないなら wrangler が自分で決める。
      #   複数アカウントを持っていて wrangler が迷ったときだけ CLOUDFLARE_ACCOUNT_ID を足せばよい
      #   (そのときは失敗ログにアカウントの一覧と ID が出る)。
      # 2026-09-08(#531・統合ビューア): GitHub Secret ADMIN_WRITE_TOKEN があるときだけ、同じ値を Worker の
      #   Secret ADMIN_WRITE_TOKEN にも入れる(wrangler-action の secrets 入力= `wrangler secret put` 相当)。
      #   統合ビューアの高知 結果自動保存(nar-jobs の KOCHI_WRITE_TOKEN)と値をそろえるため。無ければ今までどおり触らない。
      - name: wrangler deploy
        uses: cloudflare/wrangler-action@v3
        env:
          ADMIN_WRITE_TOKEN: ${{ secrets.ADMIN_WRITE_TOKEN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}   # 未設定なら空= wrangler が自分で決める
          packageManager: pnpm                                # ⛔上で入れたものと揃える(既定の自動判定に任せない)
          command: deploy
          secrets: |
            ADMIN_WRITE_TOKEN

      # ⛔出したあとに同じ検査をして、変わったことを数で見せる
      - name: 出したあとの状態を見る(検算)
        shell: bash
        run: |
          sleep 10
          echo "--- Origin: https://nar.yukochi.com を付けて OPTIONS ---"
          out=$(curl -s -i -X OPTIONS -H 'Origin: https://nar.yukochi.com' \
            'https://keiba-proxydeploy.maguronagareboshi.workers.dev/rpc/admin-chihou-own?race_id=1')
          echo "$out" | grep -i '^HTTP\|access-control-allow-origin' || true
          if echo "$out" | grep -qi 'access-control-allow-origin: https://nar.yukochi.com'; then
            echo "OK: §58 の admin read 経路が nar.yukochi.com を許可しています"
          else
            echo "⚠ まだ nar.yukochi.com を許可していません。ALLOWED_ORIGINS を確認してください"
            exit 1
          fi
          echo "--- トークン無しの GET は 401 のままか(閲覧者に漏れていないこと) ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            'https://keiba-proxydeploy.maguronagareboshi.workers.dev/rpc/admin-chihou-own?race_id=1')
          echo "status=$code"
          [ "$code" = "401" ] || { echo "⚠ 401 ではありません。中止して調べてください"; exit 1; }
