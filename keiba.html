<title>地方競馬ビューア（門別・大井）は新しいサイトへ移りました</title>
<script>
// 旧の「地方競馬ビューア（門別＋南関）」は 2026-09-12 で役目を終え、新しいサイトへ統合しました。
// 旧ブックマーク(?track=大井 など)は同じ競馬場のページへ送る。
(function () {
  var map = { '門別': 'monbetsu', '大井': 'ooi', '船橋': 'funabashi', '川崎': 'kawasaki', '浦和': 'urawa' };
  var t = '';
  try { t = decodeURIComponent((new URLSearchParams(location.search)).get('track') || ''); } catch (e) { t = ''; }
  var v = map[t] || 'monbetsu';
  location.replace('https://nar.yukochi.com/venue/' + v);
})();
</script>
</head><body style="font-family:sans-serif;padding:20px">
